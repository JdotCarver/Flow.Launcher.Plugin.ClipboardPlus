# .github/workflows/runner-request.yml
#
# One explicit Windows run per request commit, dispatched by a push.
#
#   bash tools/github_actions_runner/request_run.sh local-windows "Job Name"
#
# The request script rewrites .github/runner-request.toml and pushes it; that
# path is the only trigger, so ordinary commits never start a run. The planner
# validates the request and picks the runner labels, the workload runs on that
# runner, and the exporter republishes every job's log to the `actions-logs`
# branch because artifact and signed-URL downloads are blocked in the sandbox
# (see tools/github_actions_runner/AGENTS.md).
#
# The workload verifies the tool kit itself: its unit tests, and a redaction
# round trip over a log shaped like a real self-hosted job. Replace those steps
# when the question changes; keep the planner and the exporter.
#
# Every step runs under PowerShell. Both targets here are Windows, and
# `shell: bash` on a self-hosted Windows runner resolves to WSL's bash, which
# mangles the Windows temp-script path -- see AGENTS.md.

name: Runner request

on:
  push:
    paths:
      - .github/runner-request.toml

concurrency:
  group: runner-request-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege. Only the exporter writes anything, so only it gets a
# write-capable token. The workload job runs on a self-hosted runner on a
# personal machine, which is the worst place in this workflow to hand out a token
# that can push to the repository.
permissions:
  contents: read

jobs:
  select-runner:
    name: Select runner
    runs-on: ubuntu-24.04
    outputs:
      request_id: ${{ steps.request.outputs.request_id }}
      target: ${{ steps.request.outputs.target }}
      workload_name: ${{ steps.request.outputs.workload_name }}
      runner_labels: ${{ steps.request.outputs.runner_labels }}
    steps:
      - name: Check out the request commit
        uses: actions/checkout@v4

      - name: Validate the request
        id: request
        run: python3 tools/github_actions_runner/select_runner.py .github/runner-request.toml >> "$GITHUB_OUTPUT"

      - name: Report the selection
        run: |
          echo "target: ${{ steps.request.outputs.target }}"
          echo "labels: ${{ steps.request.outputs.runner_labels }}"
          echo "workload: ${{ steps.request.outputs.workload_name }}"

  workload:
    name: ${{ needs.select-runner.outputs.workload_name }}
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runner_labels) }}
    timeout-minutes: 30
    steps:
      - name: Check out the request commit
        uses: actions/checkout@v4
        with:
          # The benchmark extracts the published code from origin/main, so the
          # whole history has to be here.
          fetch-depth: 0

      # GitHub-hosted runners are bare, so they need a Python installed. The
      # session runner is a real desktop that already has one -- and
      # actions/setup-python cannot install there: it asks for registry access it
      # does not have, then retries for twenty minutes before failing.
      - name: Install Python (hosted runners only)
        if: needs.select-runner.outputs.target != 'local-windows'
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Resolve the Python to run with
        shell: pwsh
        run: |
          $resolved = $null
          foreach ($candidate in @('py', 'python', 'python3')) {
            $command = Get-Command $candidate -ErrorAction SilentlyContinue
            if (-not $command) { continue }
            $executable = & $command.Source -c "import sys; print(sys.executable)" 2>$null
            if ($LASTEXITCODE -eq 0 -and $executable) {
              $resolved = "$executable".Trim()
              break
            }
          }
          if (-not $resolved) { throw "No usable Python found on this runner." }
          "PYTHON=$resolved" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $resolved --version

      - name: Environment
        run: |
          # Family and architecture only: the exact build is a finding aid for
          # an attacker, and these logs are public. See
          # tools/github_actions_runner/machine_label.py.
          & $env:PYTHON -c "import sqlite3, sys; sys.path.insert(0, 'tools/github_actions_runner'); from machine_label import describe_machine; print('python', sys.version.split()[0], '| sqlite', sqlite3.sqlite_version, '|', describe_machine())"

      - name: Runner receipt
        run: |
          & $env:PYTHON tools/github_actions_runner/probe.py .github/runner-request.toml

      - name: Unit tests
        run: |
          # The tests live in dev/ and are not part of what a consumer
          # repository copies, so their absence is expected there and is
          # reported rather than treated as a failure.
          $testDirectory = "dev/tests"
          if (-not (Test-Path $testDirectory)) {
            Write-Host "No dev/tests directory; this repository ships the kit without its tests. Skipping."
            exit 0
          }
          # `unittest discover` exits 0 when it finds no tests at all, so a
          # renamed test directory would report green having run nothing. Count
          # them and fail below the expected floor instead.
          & $env:PYTHON -m unittest discover -s $testDirectory -p "test_*.py" -v 2>&1 | Tee-Object -Variable testOutput
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $summary = ($testOutput | Select-String -Pattern '^Ran (\d+) tests').Matches
          if (-not $summary -or [int]$summary.Groups[1].Value -lt 20) {
            throw "Expected at least 20 tests to run; discovery found none or too few."
          }

      # A short temporary drive avoids MAX_PATH failures in native SQLite and
      # WPF image URIs under the runner's deeply nested checkout directory.
      # Read only the approved pin metadata and WhisperWriter source on the
      # local runner. Only predefined non-sensitive category flags leave the PC.
      - name: Inspect local interoperability signals
        id: local-signals
        if: needs.select-runner.outputs.target == 'local-windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $shape = 'unavailable'
          $known = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)
          try {
            $root = Join-Path ([Environment]::GetFolderPath('LocalApplicationData')) 'Microsoft\Windows\Clipboard\Pinned'
            $containers = @(Get-ChildItem -LiteralPath $root -Directory -Force -ErrorAction Stop)
            $shapes = [System.Collections.Generic.HashSet[string]]::new()
            foreach ($container in $containers) {
              $text = [System.IO.File]::ReadAllText((Join-Path $container.FullName 'metadata.json'))
              $doc = [System.Text.Json.JsonDocument]::Parse($text)
              try {
                if ($doc.RootElement.ValueKind -ne [System.Text.Json.JsonValueKind]::Object) {
                  [void]$shapes.Add('root-not-object'); continue
                }
                $found = $false
                foreach ($property in $doc.RootElement.EnumerateObject()) {
                  if ($property.Name -cin @('Items', 'items')) {
                    if ($property.Name -ceq 'Items') { [void]$known.Add('items-upper') } else { [void]$known.Add('items-lower') }
                    if ($property.Value.ValueKind -eq [System.Text.Json.JsonValueKind]::Object) {
                      $itemCount = @($property.Value.EnumerateObject()).Count
                      if ($itemCount -eq 0) { [void]$known.Add('items-empty') } else { [void]$known.Add('items-nonempty') }
                    }
                    $found = $true
                    $kind = $property.Value.ValueKind.ToString().ToLowerInvariant()
                    if ($kind -in @('object','array','null','string','number','true','false')) { [void]$shapes.Add('items-' + $kind) }
                    else { [void]$shapes.Add('items-other') }
                  }
                  foreach ($allowed in @('Version','version','Records','records','Entries','entries','Pinned','pinned','Data','data','History','history','metadata','Metadata','FormatVersion','formatVersion')) {
                    if ($property.Name -ceq $allowed) { [void]$known.Add($allowed.ToLowerInvariant()) }
                  }
                }
                if (-not $found) { [void]$shapes.Add('items-absent') }
              } finally { $doc.Dispose() }
            }
            if ($containers.Count -eq 0) { $shape = 'empty' }
            elseif ($shapes.Count -eq 1) { $shape = @($shapes)[0] }
            else { $shape = 'mixed' }
          } catch { $shape = 'unavailable' }
          "shape=$shape" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          foreach ($name in @('version','records','entries','pinned','data','history','metadata','formatversion','items-upper','items-lower','items-empty','items-nonempty')) {
            if ($known.Contains($name)) { "$name=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8 }
          }
          $source = 'unavailable'
          try {
            # Do not read configuration, replacement rules, or arbitrary files.
            $drive = 'W:\'
            if (Test-Path -LiteralPath $drive) { 'drive=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8 }
            $base = @(Get-ChildItem -LiteralPath $drive -Directory -Depth 3 -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -like '*WhisperWriter*' } | Select-Object -First 1)
            if ($base.Count -ne 1) { throw 'Source unavailable' }
            'base=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            $candidate = @(Get-ChildItem -LiteralPath $base[0].FullName -Filter 'input_simulation.py' -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1)
            if ($candidate.Count -ne 1) { throw 'Source unavailable' }
            $code = [System.IO.File]::ReadAllText($candidate[0].FullName)
            & $env:PYTHON tools/diagnostics/inspect_whisper_writer.py $candidate[0].FullName 2>$null
            $source = 'available'
            $checks = @{
              clipboard = 'SetClipboardText|SetClipboardData|pyperclip|clipboard\.copy'
              exclude = 'ExcludeClipboardContentFromMonitorProcessing'
              history = 'CanIncludeInClipboardHistory'
              cloud = 'CanUploadToCloudClipboard'
              restore = 'saved_formats|restore.*clipboard|clipboard.*restore|preserv.*clipboard'
              threshold = 'clipboard_threshold|char_threshold'
              sleep = 'time\.sleep|sleep\('
              empty = 'EmptyClipboard'
              textwrite = 'SetClipboardText'
              formatread = 'EnumClipboardFormats'
              formatwrite = 'SetClipboardData'
              sequence = 'GetClipboardSequenceNumber'
              viewerignore = 'Clipboard Viewer Ignore'
              paste = 'Key\.ctrl|ctrl\+v|VK_CONTROL'
            }
            foreach ($key in $checks.Keys) {
              if ($code -match $checks[$key]) { "$key=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8 }
            }
          } catch { $source = 'unavailable' }
          "source=$source" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Pin metadata shape unavailable
        if: ${{ always() && steps.local-signals.outputs.shape == 'unavailable' }}
        shell: pwsh
        run: Write-Host 'Coarse metadata category'
      - name: Pin metadata shape empty
        if: ${{ always() && steps.local-signals.outputs.shape == 'empty' }}
        shell: pwsh
        run: Write-Host 'Coarse metadata category'
      - name: Pin metadata shape root-not-object
        if: ${{ always() && steps.local-signals.outputs.shape == 'root-not-object' }}
        shell: pwsh
        run: Write-Host 'Coarse metadata category'
      - name: Pin metadata shape items-object
        if: ${{ always() && steps.local-signals.outputs.shape == 'items-object' }}
        shell: pwsh
        run: Write-Host 'Coarse metadata category'
      - name: Pin metadata shape items-array
        if: ${{ always() && steps.local-signals.outputs.shape == 'items-array' }}
        shell: pwsh
        run: Write-Host 'Coarse metadata category'
      - name: Pin metadata shape items-null
        if: ${{ always() && steps.local-signals.outputs.shape == 'items-null' }}
        shell: pwsh
        run: Write-Host 'Coarse metadata category'
      - name: Pin metadata shape items-string
        if: ${{ always() && steps.local-signals.outputs.shape == 'items-string' }}
        shell: pwsh
        run: Write-Host 'Coarse metadata category'
      - name: Pin metadata shape items-number
        if: ${{ always() && steps.local-signals.outputs.shape == 'items-number' }}
        shell: pwsh
        run: Write-Host 'Coarse metadata category'
      - name: Pin metadata shape items-true
        if: ${{ always() && steps.local-signals.outputs.shape == 'items-true' }}
        shell: pwsh
        run: Write-Host 'Coarse metadata category'
      - name: Pin metadata shape items-false
        if: ${{ always() && steps.local-signals.outputs.shape == 'items-false' }}
        shell: pwsh
        run: Write-Host 'Coarse metadata category'
      - name: Pin metadata shape items-other
        if: ${{ always() && steps.local-signals.outputs.shape == 'items-other' }}
        shell: pwsh
        run: Write-Host 'Coarse metadata category'
      - name: Pin metadata shape items-absent
        if: ${{ always() && steps.local-signals.outputs.shape == 'items-absent' }}
        shell: pwsh
        run: Write-Host 'Coarse metadata category'
      - name: Pin metadata shape mixed
        if: ${{ always() && steps.local-signals.outputs.shape == 'mixed' }}
        shell: pwsh
        run: Write-Host 'Coarse metadata category'
      - name: Pin metadata has known key version
        if: ${{ always() && steps.local-signals.outputs.version == 'true' }}
        shell: pwsh
        run: Write-Host 'Known schema key present'
      - name: Pin metadata has known key records
        if: ${{ always() && steps.local-signals.outputs.records == 'true' }}
        shell: pwsh
        run: Write-Host 'Known schema key present'
      - name: Pin metadata has known key entries
        if: ${{ always() && steps.local-signals.outputs.entries == 'true' }}
        shell: pwsh
        run: Write-Host 'Known schema key present'
      - name: Pin metadata has known key pinned
        if: ${{ always() && steps.local-signals.outputs.pinned == 'true' }}
        shell: pwsh
        run: Write-Host 'Known schema key present'
      - name: Pin metadata has known key data
        if: ${{ always() && steps.local-signals.outputs.data == 'true' }}
        shell: pwsh
        run: Write-Host 'Known schema key present'
      - name: Pin metadata has known key history
        if: ${{ always() && steps.local-signals.outputs.history == 'true' }}
        shell: pwsh
        run: Write-Host 'Known schema key present'
      - name: Pin metadata has known key metadata
        if: ${{ always() && steps.local-signals.outputs.metadata == 'true' }}
        shell: pwsh
        run: Write-Host 'Known schema key present'
      - name: Pin metadata has known key formatversion
        if: ${{ always() && steps.local-signals.outputs.formatversion == 'true' }}
        shell: pwsh
        run: Write-Host 'Known schema key present'
      - name: WhisperWriter signal clipboard
        if: ${{ always() && steps.local-signals.outputs.clipboard == 'true' }}
        shell: pwsh
        run: Write-Host 'Source signal present'
      - name: WhisperWriter signal exclude
        if: ${{ always() && steps.local-signals.outputs.exclude == 'true' }}
        shell: pwsh
        run: Write-Host 'Source signal present'
      - name: WhisperWriter signal history
        if: ${{ always() && steps.local-signals.outputs.history == 'true' }}
        shell: pwsh
        run: Write-Host 'Source signal present'
      - name: WhisperWriter signal cloud
        if: ${{ always() && steps.local-signals.outputs.cloud == 'true' }}
        shell: pwsh
        run: Write-Host 'Source signal present'
      - name: WhisperWriter signal restore
        if: ${{ always() && steps.local-signals.outputs.restore == 'true' }}
        shell: pwsh
        run: Write-Host 'Source signal present'
      - name: WhisperWriter signal threshold
        if: ${{ always() && steps.local-signals.outputs.threshold == 'true' }}
        shell: pwsh
        run: Write-Host 'Source signal present'
      - name: WhisperWriter signal sleep
        if: ${{ always() && steps.local-signals.outputs.sleep == 'true' }}
        shell: pwsh
        run: Write-Host 'Source signal present'
      - name: Pin metadata items-upper
        if: ${{ always() && steps.local-signals.outputs['items-upper'] == 'true' }}
        shell: pwsh
        run: Write-Host 'Coarse metadata category'
      - name: Pin metadata items-lower
        if: ${{ always() && steps.local-signals.outputs['items-lower'] == 'true' }}
        shell: pwsh
        run: Write-Host 'Coarse metadata category'
      - name: Pin metadata items-empty
        if: ${{ always() && steps.local-signals.outputs['items-empty'] == 'true' }}
        shell: pwsh
        run: Write-Host 'Coarse metadata category'
      - name: Pin metadata items-nonempty
        if: ${{ always() && steps.local-signals.outputs['items-nonempty'] == 'true' }}
        shell: pwsh
        run: Write-Host 'Coarse metadata category'
      - name: WhisperWriter drive available
        if: ${{ always() && steps.local-signals.outputs.drive == 'true' }}
        shell: pwsh
        run: Write-Host 'Source location status'
      - name: WhisperWriter base available
        if: ${{ always() && steps.local-signals.outputs.base == 'true' }}
        shell: pwsh
        run: Write-Host 'Source location status'
      - name: WhisperWriter signal empty
        if: ${{ always() && steps.local-signals.outputs.empty == 'true' }}
        shell: pwsh
        run: Write-Host 'Source signal present'
      - name: WhisperWriter signal textwrite
        if: ${{ always() && steps.local-signals.outputs.textwrite == 'true' }}
        shell: pwsh
        run: Write-Host 'Source signal present'
      - name: WhisperWriter signal formatread
        if: ${{ always() && steps.local-signals.outputs.formatread == 'true' }}
        shell: pwsh
        run: Write-Host 'Source signal present'
      - name: WhisperWriter signal formatwrite
        if: ${{ always() && steps.local-signals.outputs.formatwrite == 'true' }}
        shell: pwsh
        run: Write-Host 'Source signal present'
      - name: WhisperWriter signal sequence
        if: ${{ always() && steps.local-signals.outputs.sequence == 'true' }}
        shell: pwsh
        run: Write-Host 'Source signal present'
      - name: WhisperWriter signal viewerignore
        if: ${{ always() && steps.local-signals.outputs.viewerignore == 'true' }}
        shell: pwsh
        run: Write-Host 'Source signal present'
      - name: WhisperWriter signal paste
        if: ${{ always() && steps.local-signals.outputs.paste == 'true' }}
        shell: pwsh
        run: Write-Host 'Source signal present'
      - name: WhisperWriter structural signal paste_function
        if: ${{ always() && steps.local-signals.outputs.ast_paste_function == 'true' }}
        shell: pwsh
        run: Write-Host 'Source structure signal present'
      - name: WhisperWriter structural signal paste_sequence_call
        if: ${{ always() && steps.local-signals.outputs.ast_paste_sequence_call == 'true' }}
        shell: pwsh
        run: Write-Host 'Source structure signal present'
      - name: WhisperWriter structural signal paste_sequence_guard
        if: ${{ always() && steps.local-signals.outputs.ast_paste_sequence_guard == 'true' }}
        shell: pwsh
        run: Write-Host 'Source structure signal present'
      - name: WhisperWriter structural signal paste_enumerates_formats
        if: ${{ always() && steps.local-signals.outputs.ast_paste_enumerates_formats == 'true' }}
        shell: pwsh
        run: Write-Host 'Source structure signal present'
      - name: WhisperWriter structural signal paste_restores_formats
        if: ${{ always() && steps.local-signals.outputs.ast_paste_restores_formats == 'true' }}
        shell: pwsh
        run: Write-Host 'Source structure signal present'
      - name: WhisperWriter structural signal paste_writes_text
        if: ${{ always() && steps.local-signals.outputs.ast_paste_writes_text == 'true' }}
        shell: pwsh
        run: Write-Host 'Source structure signal present'
      - name: WhisperWriter structural signal paste_empties_clipboard
        if: ${{ always() && steps.local-signals.outputs.ast_paste_empties_clipboard == 'true' }}
        shell: pwsh
        run: Write-Host 'Source structure signal present'
      - name: WhisperWriter structural signal paste_waits
        if: ${{ always() && steps.local-signals.outputs.ast_paste_waits == 'true' }}
        shell: pwsh
        run: Write-Host 'Source structure signal present'
      - name: WhisperWriter structural signal paste_100ms_constant
        if: ${{ always() && steps.local-signals.outputs.ast_paste_100ms_constant == 'true' }}
        shell: pwsh
        run: Write-Host 'Source structure signal present'
      - name: WhisperWriter structural signal source_inspection_failed
        if: ${{ always() && steps.local-signals.outputs.ast_source_inspection_failed == 'true' }}
        shell: pwsh
        run: Write-Host 'Source structure signal present'
      - name: WhisperWriter structural signal reachable_sequence_guard
        if: ${{ always() && steps.local-signals.outputs.ast_reachable_sequence_guard == 'true' }}
        shell: pwsh
        run: Write-Host 'Source structure signal present'
      - name: WhisperWriter structural signal reachable_enumerates_formats
        if: ${{ always() && steps.local-signals.outputs.ast_reachable_enumerates_formats == 'true' }}
        shell: pwsh
        run: Write-Host 'Source structure signal present'
      - name: WhisperWriter structural signal reachable_restores_formats
        if: ${{ always() && steps.local-signals.outputs.ast_reachable_restores_formats == 'true' }}
        shell: pwsh
        run: Write-Host 'Source structure signal present'
      - name: WhisperWriter structural signal reachable_writes_text
        if: ${{ always() && steps.local-signals.outputs.ast_reachable_writes_text == 'true' }}
        shell: pwsh
        run: Write-Host 'Source structure signal present'
      - name: WhisperWriter structural signal reachable_empties_clipboard
        if: ${{ always() && steps.local-signals.outputs.ast_reachable_empties_clipboard == 'true' }}
        shell: pwsh
        run: Write-Host 'Source structure signal present'
      - name: WhisperWriter structural signal reachable_waits
        if: ${{ always() && steps.local-signals.outputs.ast_reachable_waits == 'true' }}
        shell: pwsh
        run: Write-Host 'Source structure signal present'
      - name: WhisperWriter structural signal reachable_registers_format
        if: ${{ always() && steps.local-signals.outputs.ast_reachable_registers_format == 'true' }}
        shell: pwsh
        run: Write-Host 'Source structure signal present'
      - name: WhisperWriter structural signal reachable_passed_sequence_guard
        if: ${{ always() && steps.local-signals.outputs.ast_reachable_passed_sequence_guard == 'true' }}
        shell: pwsh
        run: Write-Host 'Source structure signal present'
      - name: WhisperWriter source unavailable
        if: ${{ always() && steps.local-signals.outputs.source == 'unavailable' }}
        shell: pwsh
        run: Write-Host 'Source was unavailable'

      - name: Build and test ClipboardPlus
        shell: pwsh
        run: |
          $drive = @('Z','Y','X','W','V') | Where-Object { -not (Test-Path "${_}:\") } | Select-Object -First 1
          if (-not $drive) { throw "No temporary drive letter available" }
          subst "${drive}:" "$env:GITHUB_WORKSPACE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          try {
            Set-Location "${drive}:\"
            dotnet restore Flow.Launcher.Plugin.ClipboardPlus.sln --source https://api.nuget.org/v3/index.json *> "$env:RUNNER_TEMP\clipboardplus-build.log"
            if ($LASTEXITCODE -ne 0) { throw "Restore failed" }
            dotnet build Flow.Launcher.Plugin.ClipboardPlus.sln --configuration Release --no-restore *> "$env:RUNNER_TEMP\clipboardplus-build.log"
            if ($LASTEXITCODE -ne 0) {
              $codes = @(Get-Content "$env:RUNNER_TEMP\clipboardplus-build.log" | Select-String -Pattern 'error (CS[0-9]+)' | ForEach-Object { $_.Matches[0].Groups[1].Value } | Select-Object -Unique)
              if ($codes.Count -gt 0) { Write-Host ("Compiler error codes: " + ($codes -join ', ')) }
              throw "Build failed"
            }
            dotnet test Flow.Launcher.Plugin.ClipboardPlus.sln --configuration Release --no-build *> "$env:RUNNER_TEMP\clipboardplus-build.log"
            if ($LASTEXITCODE -ne 0) {
              $names = @(Get-Content "$env:RUNNER_TEMP\clipboardplus-build.log" | Select-String -Pattern 'Failed (Flow\.Launcher\.Plugin\.ClipboardPlus\.[A-Za-z0-9_.]+)' | ForEach-Object { $_.Matches[0].Groups[1].Value } | Select-Object -Unique)
              if ($names.Count -gt 0) { Write-Host ("Failed synthetic test names: " + ($names -join ', ')) }
              foreach ($testClass in @('SerialAsyncQueueTests', 'VerifiedDuplicateDatabaseTests', 'BulkInsertTests', 'ImagePersistenceTests', 'ImagePinTests', 'DatabaseHelperTest')) {
                dotnet test Flow.Launcher.Plugin.ClipboardPlus.sln --configuration Release --no-build --filter "FullyQualifiedName~$testClass" *> "$env:RUNNER_TEMP\clipboardplus-filtered.log"
                Write-Host "Synthetic test class $testClass exit code: $LASTEXITCODE"
              }
              Remove-Item "$env:RUNNER_TEMP\clipboardplus-filtered.log" -ErrorAction SilentlyContinue
              throw "Tests failed (details suppressed for privacy)"
            }
            Write-Host "Solution build and tests passed."
          } finally {
            Set-Location $env:RUNNER_TEMP
            Remove-Item "$env:RUNNER_TEMP\clipboardplus-build.log" -ErrorAction SilentlyContinue
            subst "${drive}:" /d
          }

      - name: Synthetic performance baseline
        id: synthetic-baseline
        if: success() || failure()
        shell: pwsh
        run: |
          $drive = @('Z','Y','X','W','V') | Where-Object { -not (Test-Path "${_}:\") } | Select-Object -First 1
          if (-not $drive) { throw "No temporary drive letter available" }
          subst "${drive}:" "$env:GITHUB_WORKSPACE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          try {
            Set-Location "${drive}:\"
            dotnet restore tools/performance-baseline/PerformanceBaseline.csproj --source https://api.nuget.org/v3/index.json *> "$env:RUNNER_TEMP\clipboardplus-benchmark.log"
            if ($LASTEXITCODE -ne 0) { throw "Baseline restore failed" }
            dotnet run --project tools/performance-baseline/PerformanceBaseline.csproj --configuration Release --no-restore *> "$env:RUNNER_TEMP\clipboardplus-benchmark.log"
            $exitCode = $LASTEXITCODE
            # Only publish recognized synthetic measurement lines, never arbitrary
            # build diagnostics, exceptions, environment values or file paths.
            Get-Content "$env:RUNNER_TEMP\clipboardplus-benchmark.log" | Where-Object {
              $_ -match '^(text create and display|image hashing only|image construct and serialize|two forced collections and finalizer wait|SQLite disk bulk insert and read|SQLite reopen and materialize|10000 live synthetic text records|plugin query|plugin synthetic text add|plugin repeated query managed heap delta|plugin capture lock wait during query|dedup planner|dedup database|dedup plugin|dedup integrated|dedup optout|dedup saved images|SQLite transaction experiment|image experiment|query experiment|image pin)[A-Za-z0-9 ,.;/():=+\-]*$'
            } | ForEach-Object { Write-Host $_ }
            if ($exitCode -ne 0) {
              $diagnostic = Get-Content -Raw "$env:RUNNER_TEMP\clipboardplus-benchmark.log"
              $fault = 'other'
              foreach ($candidate in @('NullReferenceException','InvalidOperationException','ObjectDisposedException','IOException','UnauthorizedAccessException','ArgumentException','TimeoutException','AccessViolationException','OutOfMemoryException','StackOverflowException')) {
                if ($diagnostic -match [regex]::Escape($candidate)) { $fault = $candidate; break }
              }
              if ($exitCode -eq -1073741571) { $fault = 'NativeStackOverflow' }
              if ($exitCode -eq -1073741819) { $fault = 'NativeAccessViolation' }
              "fault=$fault" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
              $frames = @{
                capture = 'GetClipboardDataItem'; localize = 'Localize'; cache = 'SaveNewImageCache';
                filename = 'FormatImageName'; ownership = 'ManagedCacheFile'; host = 'SyntheticHost';
                integration = 'TestOptOutImageCache'; dispatcher = 'Dispatcher'; service = 'GetRequiredService'
              }
              foreach ($name in $frames.Keys) {
                if ($diagnostic -match $frames[$name]) { "frame_$name=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8 }
              }
              $codes = @(Get-Content "$env:RUNNER_TEMP\clipboardplus-benchmark.log" | Select-String -Pattern 'error (CS[0-9]+)' | ForEach-Object { $_.Matches[0].Groups[1].Value } | Select-Object -Unique)
              if ($codes.Count -gt 0) { Write-Host ("Compiler error codes: " + ($codes -join ', ')) }
              throw "Baseline failed (details suppressed for privacy)"
            }
          } finally {
            Set-Location $env:RUNNER_TEMP
            Remove-Item "$env:RUNNER_TEMP\clipboardplus-benchmark.log" -ErrorAction SilentlyContinue
            subst "${drive}:" /d
          }

