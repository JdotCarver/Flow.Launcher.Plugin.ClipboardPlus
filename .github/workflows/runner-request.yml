      - name: Compare actual bulk method before and after
        if: success() || failure()
        shell: pwsh
        run: |
          $drive = @('Z','Y','X','W','V') | Where-Object { -not (Test-Path "${_}:\") } | Select-Object -First 1
          if (-not $drive) { throw "No temporary drive letter available" }
          subst "${drive}:" "$env:GITHUB_WORKSPACE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $scratch = "${drive}:\.benchmark-ab"
          $diagnostic = "$env:RUNNER_TEMP\clipboardplus-ab.log"
          try {
            Set-Location "${drive}:\"
            New-Item -ItemType Directory -Path "$scratch\before", "$scratch\after" -Force | Out-Null
            git archive --format=tar --output="$scratch\snapshot.tar" HEAD *>> $diagnostic
            if ($LASTEXITCODE -ne 0) { throw "Snapshot failed" }
            foreach ($variant in @('before', 'after')) {
              tar -xf "$scratch\snapshot.tar" -C "$scratch\$variant" *>> $diagnostic
              if ($LASTEXITCODE -ne 0) { throw "Snapshot extraction failed" }
            }
            # The historical caller is not partial and cannot include the new
            # cleanup integration in the before snapshot.
            Remove-Item "$scratch\before\src\Flow.Launcher.Plugin.ClipboardPlus\ClipboardPlus.Cleanup.cs" -ErrorAction SilentlyContinue
            Remove-Item "$scratch\before\src\Flow.Launcher.Plugin.ClipboardPlus\ClipboardPlus.WindowsSuppression.cs" -ErrorAction SilentlyContinue
            Remove-Item "$scratch\before\src\Flow.Launcher.Plugin.ClipboardPlus\ClipboardPlus.CacheCleanup.cs" -ErrorAction SilentlyContinue
            # The historical ClipboardData lacks the newer origin marker.
            Remove-Item "$scratch\before\src\Flow.Launcher.Plugin.ClipboardPlus.Core.Test\WindowsOriginPinTests.cs" -ErrorAction SilentlyContinue
            git show be98be6:src/Flow.Launcher.Plugin.ClipboardPlus.Core/Helpers/ClipboardCleanupSnapshot.cs 2>> $diagnostic |
              Set-Content -Encoding utf8 "$scratch\before\src\Flow.Launcher.Plugin.ClipboardPlus.Core\Helpers\ClipboardCleanupSnapshot.cs"
            if ($LASTEXITCODE -ne 0) { throw "Historical snapshot helper unavailable" }
            git show 077bf9c:src/Flow.Launcher.Plugin.ClipboardPlus.Core/Data/Models/Database/SqliteDatabase.cs 2>> $diagnostic |
              Set-Content -Encoding utf8 "$scratch\before\src\Flow.Launcher.Plugin.ClipboardPlus.Core\Data\Models\Database\SqliteDatabase.cs"
            if ($LASTEXITCODE -ne 0) { throw "Baseline source unavailable" }
            # The old database lacks the new image-reuse API, so use the
            # pre-image versions of its callers in the bulk baseline too.
            foreach ($relative in @(
              'src/Flow.Launcher.Plugin.ClipboardPlus/Main.cs',
              'src/Flow.Launcher.Plugin.ClipboardPlus.Core/Data/Models/Clipboard/ClipboardData.cs'
            )) {
              git show "6a8203d:$relative" 2>> $diagnostic | Set-Content -Encoding utf8 "$scratch\before\$relative"
              if ($LASTEXITCODE -ne 0) { throw "Bulk baseline caller source unavailable" }
            }
            foreach ($variant in @('before', 'after')) {
              Set-Location "$scratch\$variant"
              dotnet restore tools/performance-baseline/PerformanceBaseline.csproj --source https://api.nuget.org/v3/index.json *> $diagnostic
              if ($LASTEXITCODE -ne 0) { throw "A/B restore failed" }
              dotnet run --project tools/performance-baseline/PerformanceBaseline.csproj --configuration Release --no-restore -- --bulk-only *> $diagnostic
              $exitCode = $LASTEXITCODE
              $measurement = @(Get-Content $diagnostic | Where-Object { $_ -match '^actual bulk insert 500 records: ms min/median/max=[0-9,./]+$' })
              if ($exitCode -ne 0 -or $measurement.Count -ne 1) { throw "A/B benchmark failed (details suppressed for privacy)" }
              Write-Host "$variant $($measurement[0])"
            }
            # Replace only the three pre-image-change production files in the
            # before snapshot; the same current harness runs in both copies.
            Set-Location "${drive}:\"
            foreach ($relative in @(
              'src/Flow.Launcher.Plugin.ClipboardPlus/Main.cs',
              'src/Flow.Launcher.Plugin.ClipboardPlus.Core/Data/Models/Clipboard/ClipboardData.cs',
              'src/Flow.Launcher.Plugin.ClipboardPlus.Core/Data/Models/Database/SqliteDatabase.cs'
            )) {
              git show "6a8203d:$relative" 2>> $diagnostic | Set-Content -Encoding utf8 "$scratch\before\$relative"
              if ($LASTEXITCODE -ne 0) { throw "Image baseline source unavailable" }
            }
            foreach ($variant in @('before', 'after')) {
              Set-Location "$scratch\$variant"
              dotnet run --project tools/performance-baseline/PerformanceBaseline.csproj --configuration Release --no-restore -- --image-capture-only *> $diagnostic
              $exitCode = $LASTEXITCODE
              $measurement = @(Get-Content $diagnostic | Where-Object { $_ -match '^actual image capture save 1024 noise: ms min/median/max=[0-9,./]+$' })
              if ($exitCode -ne 0 -or $measurement.Count -ne 1) {
                $codes = @(Get-Content $diagnostic | Select-String -Pattern 'error (CS[0-9]+)' | ForEach-Object { $_.Matches[0].Groups[1].Value } | Select-Object -Unique)
                if ($codes.Count -gt 0) { Write-Host ("Compiler error codes: " + ($codes -join ', ')) }
                $exceptions = @(Get-Content $diagnostic | Select-String -Pattern '(System\.[A-Za-z.]+Exception)' | ForEach-Object { $_.Matches[0].Groups[1].Value } | Select-Object -Unique)
                if ($exceptions.Count -gt 0) { Write-Host ("Exception types: " + ($exceptions -join ', ')) }
                throw "Image capture A/B failed (details suppressed for privacy)"
              }
              Write-Host "$variant $($measurement[0])"
            }
            # The pin baseline uses the current partial caller and database.
            Set-Location "${drive}:\"
            git show HEAD:src/Flow.Launcher.Plugin.ClipboardPlus/ClipboardPlus.Cleanup.cs 2>> $diagnostic |
              Set-Content -Encoding utf8 "$scratch\before\src\Flow.Launcher.Plugin.ClipboardPlus\ClipboardPlus.Cleanup.cs"
            if ($LASTEXITCODE -ne 0) { throw "Cleanup caller source unavailable" }
            git show HEAD:src/Flow.Launcher.Plugin.ClipboardPlus/ClipboardPlus.WindowsSuppression.cs 2>> $diagnostic |
              Set-Content -Encoding utf8 "$scratch\before\src\Flow.Launcher.Plugin.ClipboardPlus\ClipboardPlus.WindowsSuppression.cs"
            if ($LASTEXITCODE -ne 0) { throw "Suppression caller source unavailable" }
            git show HEAD:src/Flow.Launcher.Plugin.ClipboardPlus/ClipboardPlus.CacheCleanup.cs 2>> $diagnostic |
              Set-Content -Encoding utf8 "$scratch\before\src\Flow.Launcher.Plugin.ClipboardPlus\ClipboardPlus.CacheCleanup.cs"
            if ($LASTEXITCODE -ne 0) { throw "Cache caller source unavailable" }
            # Pinning baseline differs only in the record implementation.
            Set-Location "${drive}:\"
            foreach ($relative in @(
              'src/Flow.Launcher.Plugin.ClipboardPlus.Core/Data/Models/Clipboard/ClipboardData.cs',
              'src/Flow.Launcher.Plugin.ClipboardPlus.Core/Helpers/ClipboardCleanupSnapshot.cs'
            )) {
              git show "HEAD:$relative" 2>> $diagnostic | Set-Content -Encoding utf8 "$scratch\before\$relative"
              if ($LASTEXITCODE -ne 0) { throw "Pin baseline source unavailable" }
            }
            # Isolate the old pinning cost without discarding newer safety metadata.
            $pinSource = "$scratch\before\src\Flow.Launcher.Plugin.ClipboardPlus.Core\Data\Models\Clipboard\ClipboardData.cs"
            $pinText = Get-Content -Raw $pinSource
            $oldPinText = $pinText.Replace('new ClipboardData(Data, DataType, EncryptData, CanReuseImageHash ? DataMd5 : null)', 'new ClipboardData(Data, DataType, EncryptData)')
            if ($pinText -eq $oldPinText) { throw "Pin baseline transformation unavailable" }
            Set-Content -Encoding utf8 $pinSource $oldPinText
            # Restore the current image-capture implementation in the before
            # tree, so that only the hash-reuse change differs.
            foreach ($relative in @(
              'src/Flow.Launcher.Plugin.ClipboardPlus/Main.cs',
              'src/Flow.Launcher.Plugin.ClipboardPlus.Core/Data/Models/Database/SqliteDatabase.cs'
            )) {
              git show "HEAD:$relative" 2>> $diagnostic | Set-Content -Encoding utf8 "$scratch\before\$relative"
              if ($LASTEXITCODE -ne 0) { throw "Pin baseline source unavailable" }
            }
            foreach ($variant in @('before', 'after')) {
              Set-Location "$scratch\$variant"
              dotnet run --project tools/performance-baseline/PerformanceBaseline.csproj --configuration Release --no-restore -- --image-pin-only *> $diagnostic
              $exitCode = $LASTEXITCODE
              $measurement = @(Get-Content $diagnostic | Where-Object { $_ -match '^actual image pin 1024 noise: ms min/median/max=[0-9,./]+; median allocated=[0-9,.]+ MiB$' })
              if ($exitCode -ne 0 -or $measurement.Count -ne 1) { throw "Image pin A/B failed (details suppressed for privacy)" }
              Write-Host "$variant $($measurement[0])"
            }
          } finally {
            Set-Location "${drive}:\"
            Remove-Item $scratch -Recurse -Force -ErrorAction SilentlyContinue
            Set-Location $env:RUNNER_TEMP
            Remove-Item $diagnostic -ErrorAction SilentlyContinue
            subst "${drive}:" /d
          }

      - name: Redaction round trip on a realistic log
        run: |
          # The redactor harvests identifiers from the log itself, so it must be
          # checked against text shaped like a real self-hosted job rather than
          # only against hand-written fixtures.
          & $env:PYTHON tools/github_actions_runner/check_redaction.py

  export-logs:
    name: Export logs
    needs:
      - select-runner
      - workload
    # This session must not write to a different branch. Job status remains
    # available through the Actions API without publishing exported logs.
    if: ${{ always() && github.ref != 'refs/heads/arena/a3420224-flow-launcher-plugin-clipboard' }}
    runs-on: ubuntu-24.04
    permissions:
      # `contents: write` pushes the actions-logs branch. `actions: read` is
      # required to download the job logs in the first place: declaring a
      # `permissions:` block sets every other scope to none, so dropping this
      # made the export fail with 403 (observed on run 40525884741).
      #
      # `actions: write` is deliberately absent. The plan was to delete GitHub's
      # unredacted copy of this run's logs from here, but that endpoint answers
      # 403 while the workflow is running, and the exporter is part of the run it
      # would be cleaning up. See AGENTS.md.
      contents: write
      actions: read
    steps:
      - name: Check out the request commit
        uses: actions/checkout@v4

      - name: Publish this run's logs to the actions-logs branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/github_actions_runner/export_logs.py --exporter-name "Export logs"
